<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | Guide System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky-blue: #a5d8ff;
            --y2k-blue: #74c0fc;
            --deep-blue: #1c7ed6;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #f0f8ff; font-family: 'Outfit', sans-serif; 
            overflow-x: hidden;
        }

        /* الغيوم والنجوم */
        .cloud-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }
        .cloud { position: absolute; background: white; border-radius: 100px; filter: blur(40px); animation: move var(--d) linear infinite; opacity: 0.5; }
        @keyframes move { from { transform: translateX(-200px); } to { transform: translateX(110vw); } }
        .star { position: absolute; color: var(--y2k-blue); font-size: 18px; z-index: 6; animation: blink 2s infinite ease-in-out; }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        /* --- Siya Character --- */
        #siya-container {
            position: fixed;
            bottom: -500px; /* البداية تحت الشاشة */
            right: 20px;
            width: 250px;
            z-index: 9999; /* رقم عالي جدا لضمان الظهور فوق الكل */
            display: block !important;
            transition: bottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #siya-container img {
            width: 100%;
            height: auto;
            border: none;
            outline: none;
        }

        /* فقاعة الكلام */
        .speech-bubble {
            position: absolute;
            bottom: 85%;
            right: 20px;
            width: 220px;
            background: white;
            border: 3px solid var(--y2k-blue);
            padding: 15px;
            border-radius: 25px 25px 0 25px;
            font-size: 0.9rem;
            font-weight: 900;
            color: var(--deep-blue);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            z-index: 10000;
        }

        .show-bubble {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }

        /* المحتوى */
        .main-ui { position: relative; z-index: 10; padding-top: 100px; text-align: center; }
        nav { position: fixed; top: 0; width: 100%; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); z-index: 1000; padding: 20px 0; border-bottom: 2px solid var(--sky-blue); }
    </style>
</head>
<body>

    <div class="cloud-bg" id="clouds"></div>

    <div id="siya-container">
        <div class="speech-bubble" id="bubble">Hello! I'm finally here! ✨</div>
        <img src="siya.jpg" id="siya-img" alt="Siya Guide">
    </div>

    <nav>
        <img src="assets/logo.jpg" onerror="this.src='assets/logo.png'" style="height: 60px;">
    </nav>

    <div class="main-ui">
        <h1 style="font-size: 4rem; color: var(--deep-blue);">SIYA STORE</h1>
        <p>Interactive Shopping Experience</p>
    </div>

    <script>
        const siyaBox = document.getElementById('siya-container');
        const bubble = document.getElementById('bubble');
        const img = document.getElementById('siya-img');

        // 1. منطق الغيوم والنجوم
        const cloudContainer = document.getElementById('clouds');
        for (let i = 0; i < 6; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            const size = Math.random() * 200 + 150;
            cloud.style.width = size + 'px'; cloud.style.height = (size * 0.6) + 'px';
            cloud.style.top = Math.random() * 80 + 'vh'; cloud.style.left = Math.random() * 100 + 'vw';
            cloud.style.setProperty('--d', (Math.random() * 20 + 20) + 's');
            cloudContainer.appendChild(cloud);
        }

        // 2. إظهار Siya عند تحميل الصورة
        img.onload = function() {
            console.log("Image loaded successfully!");
            setTimeout(() => {
                siyaBox.style.bottom = "0px"; // الشخصية كطلع
                setTimeout(() => {
                    speak("Welcome! Hover over items to chat!");
                }, 1000);
            }, 500);
        };

        // في حالة فشل تحميل الصورة (الاحتياط)
        img.onerror = function() {
            console.error("Image NOT found! Please check if 'siya.jpg' is in the folder.");
            alert("Warning: 'siya.jpg' not found in the root folder!");
        };

        function speak(text) {
            bubble.innerText = text;
            bubble.classList.add('show-bubble');
            setTimeout(() => {
                bubble.classList.remove('show-bubble');
            }, 5000);
        }
    </script>
</body>
</html>
