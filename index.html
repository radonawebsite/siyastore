<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | NOTI Collection</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;700&family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sky-blue: #87CEEB;
            --deep-blue: #0077b6;
            --white: #ffffff;
            --light-bg: #f0faff;
        }

        body { margin: 0; background: var(--white); color: #333; font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        /* Navigation */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            padding: 20px 50px; box-sizing: border-box; z-index: 100;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(135, 206, 235, 0.3);
        }
        .brand-logo { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--deep-blue); text-transform: uppercase; }
        .brand-logo span { color: var(--sky-blue); font-size: 0.8rem; display: block; font-family: 'Montserrat'; font-weight: 200; }

        .nav-links a { color: #555; text-decoration: none; margin-left: 35px; font-size: 0.85rem; letter-spacing: 1px; transition: 0.3s; }
        .nav-links a:hover { color: var(--sky-blue); }

        /* Hero Section */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; background: transparent;
        }
        .hero h2 { font-weight: 200; letter-spacing: 10px; color: var(--sky-blue); text-transform: uppercase; }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 6rem; margin: 0; color: var(--deep-blue); }

        /* Shop Section */
        #shop { padding: 80px 10%; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; background: var(--white); }
        .item-card {
            background: var(--light-bg); border-radius: 0; padding: 10px;
            transition: 0.5s ease; border: 1px solid transparent;
        }
        .item-card:hover { transform: translateY(-10px); border-color: var(--sky-blue); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .item-card img { width: 100%; height: 450px; object-fit: cover; }
        
        .item-info { padding: 25px; text-align: center; }
        .item-info h3 { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 0; color: #222; }
        .item-price { color: var(--deep-blue); font-weight: 700; font-size: 1.2rem; margin: 15px 0; display: block; }

        .buy-btn {
            width: 100%; padding: 15px; background: var(--deep-blue); border: none;
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 2px;
        }
        .buy-btn:hover { background: var(--sky-blue); }

        footer { padding: 40px; text-align: center; background: var(--light-bg); color: #888; font-size: 0.75rem; }
    </style>
</head>
<body>

    <nav>
        <div class="brand-logo">Siya Store <span>Curated for NOTI</span></div>
        <div class="nav-links">
            <a href="#home">HOME</a>
            <a href="#shop">SHOP</a>
            <a href="#">COLLECTION</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h2>Exclusive Artist Series</h2>
        <h1>NOTI</h1>
        <p style="color: #888; letter-spacing: 3px;">Heavenly Creations & Timeless Art</p>
    </section>

    <section id="shop">
        <div class="item-card">
            <img src="https://images.unsplash.com/photo-1513519245088-0e12902e5a38?auto=format&fit=crop&q=80&w=1000" alt="Art 1">
            <div class="item-info">
                <h3>Azure Serenity #01</h3>
                <span class="item-price">$1,800.00</span>
                <button class="buy-btn">BUY NOW</button>
            </div>
        </div>
        <div class="item-card">
            <img src="https://images.unsplash.com/photo-1554188248-986adbb73be4?auto=format&fit=crop&q=80&w=1000" alt="Art 2">
            <div class="item-info">
                <h3>Cloud Vision</h3>
                <span class="item-price">$2,400.00</span>
                <button class="buy-btn">BUY NOW</button>
            </div>
        </div>
    </section>

    <footer>© 2026 SIYA STORE. ARTISTIC DIRECTION BY NOTI.</footer>

    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Sky Blue Floating Particles
        const particlesGeom = new THREE.BufferGeometry();
        const count = 4000;
        const positions = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) { positions[i] = (Math.random() - 0.5) * 12; }
        particlesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.008, color: 0x87CEEB, transparent: true, opacity: 0.5 });
        const points = new THREE.Points(particlesGeom, particlesMat);
        scene.add(points);

        camera.position.z = 4;

        function animate() {
            requestAnimationFrame(animate);
            points.rotation.y += 0.0008;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
