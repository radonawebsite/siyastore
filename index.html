<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | NOTI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky: #a5d8ff;
            --main: #74c0fc;
            --deep: #1c7ed6;
            --white: #ffffff;
        }

        body { 
            margin: 0; background: var(--white); 
            font-family: 'Outfit', sans-serif; overflow-x: hidden; 
            cursor: none; /* غادي نعوضو الماوس بواحد الدائرة سحرية */
        }

        /* Custom Cursor */
        #cursor {
            position: fixed; width: 20px; height: 20px;
            background: rgba(116, 192, 252, 0.3); border: 2px solid var(--main);
            border-radius: 50%; pointer-events: none; z-index: 9999;
            transition: transform 0.1s ease;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 20px 5%; box-sizing: border-box; z-index: 1000;
        }
        
        .nav-logo img { height: 80px; transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-logo img:hover { transform: scale(1.1) rotate(5deg); }

        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; position: relative; z-index: 10;
        }

        .hero h1 { 
            font-size: clamp(4rem, 15vw, 9rem); font-weight: 900; color: var(--deep);
            margin: 0; pointer-events: none;
        }

        /* Interactive Product Cards */
        .products { 
            padding: 100px 5%; display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 50px; position: relative; z-index: 10;
        }

        .card {
            background: rgba(255, 255, 255, 0.8); border-radius: 40px;
            padding: 20px; border: 1px solid var(--sky);
            transition: all 0.3s ease; text-align: center;
            box-shadow: 0 10px 30px rgba(116, 192, 252, 0.1);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--main);
            box-shadow: 0 20px 50px rgba(116, 192, 252, 0.3);
        }

        .card img { width: 100%; border-radius: 30px; margin-bottom: 15px; }

        .btn {
            padding: 15px 35px; background: var(--deep); color: white;
            border: none; border-radius: 50px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
        }

        .btn:active { transform: scale(0.9); }

    </style>
</head>
<body>

    <div id="cursor"></div>

    <nav>
        <div class="nav-logo"><img src="assets/logo.jpg" onerror="this.src='assets/logo.png'" alt="Siya Store"></div>
        <div style="font-weight: 900; letter-spacing: 5px; color: var(--main);">MENU</div>
    </nav>

    <div class="hero">
        <p style="letter-spacing: 10px; color: var(--main);">COLLECTION BY NOTI</p>
        <h1>SIYA STORE</h1>
    </div>

    <div class="products">
        <div class="card" onclick="playEffect(event)">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000">
            <h3>Sky Element #01</h3>
            <button class="btn">VIEW DETAILS</button>
        </div>
        <div class="card" onclick="playEffect(event)">
            <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?q=80&w=1000">
            <h3>Cloud Element #02</h3>
            <button class="btn">VIEW DETAILS</button>
        </div>
    </div>

    <script>
        // --- 1. Custom Cursor Follower ---
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, { x: e.clientX - 10, y: e.clientY - 10, duration: 0.2 });
        });

        // --- 2. Magnetic/Click Effect ---
        function playEffect(e) {
            // تأثير انفجار سحابي عند الضغط
            for(let i=0; i<8; i++) {
                const particle = document.createElement('div');
                particle.style.cssText = `
                    position: fixed; left: ${e.clientX}px; top: ${e.clientY}px;
                    width: 15px; height: 15px; background: var(--main);
                    border-radius: 50%; pointer-events: none; z-index: 2000;
                    opacity: 0.6;
                `;
                document.body.appendChild(particle);
                gsap.to(particle, {
                    x: (Math.random() - 0.5) * 200,
                    y: (Math.random() - 0.5) * 200,
                    opacity: 0,
                    scale: 0,
                    duration: 1,
                    onComplete: () => particle.remove()
                });
            }
        }

        // --- 3. 3D Clouds Background Control ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Spheres that act like "Soft Clouds"
        const clouds = [];
        const geom = new THREE.SphereGeometry(1, 32, 32);
        for(let i=0; i<15; i++) {
            const mat = new THREE.MeshPhongMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.2 });
            const cloud = new THREE.Mesh(geom, mat);
            cloud.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
            scene.add(cloud);
            clouds.push(cloud);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const light = new THREE.PointLight(0xffffff, 1);
        light.position.set(5, 5, 5);
        scene.add(light);

        camera.position.z = 5;

        // Mouse Move -> Control Scene
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            gsap.to(camera.position, { x: x, y: -y, duration: 1.5 });
        });

        function animate() {
            requestAnimationFrame(animate);
            clouds.forEach(c => {
                c.rotation.y += 0.002;
                c.position.y += Math.sin(Date.now() * 0.001) * 0.002;
            });
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
