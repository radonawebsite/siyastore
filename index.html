<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | NOTI Universe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky-blue: #a5d8ff;
            --main-blue: #74c0fc;
            --deep-blue: #1c7ed6;
            --white: #ffffff;
        }

        body { margin: 0; background: #e7f5ff; font-family: 'Outfit', sans-serif; overflow-x: hidden; color: var(--deep-blue); }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

        /* Navbar */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 5%; box-sizing: border-box; z-index: 100;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(116, 192, 252, 0.2);
        }
        
        /* تصحيح قياسات اللوجو */
        .nav-logo img { 
            height: clamp(50px, 12vw, 85px); 
            filter: drop-shadow(0 0 8px rgba(116, 192, 252, 0.3));
            transition: 0.3s;
        }
        .nav-logo img:hover { transform: scale(1.05); }

        .nav-links a { text-decoration: none; color: var(--deep-blue); font-weight: 700; font-size: 0.85rem; letter-spacing: 1px; }

        /* Hero Section */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 0 20px;
        }
        .hero-title { 
            font-size: clamp(3.5rem, 18vw, 9rem); 
            font-weight: 900; line-height: 0.85; margin: 0; 
            text-transform: uppercase; 
        }
        .hero-subtitle { 
            font-size: clamp(0.9rem, 4.5vw, 1.3rem); 
            letter-spacing: clamp(6px, 3vw, 18px); 
            margin-top: 25px; color: var(--main-blue);
            font-weight: 400;
        }

        /* Products Grid */
        .products { 
            padding: 60px 5%; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 35px; 
            max-width: 1300px; margin: auto;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.6); padding: 25px; border-radius: 35px;
            text-align: center; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-card:hover { transform: translateY(-12px); background: rgba(255, 255, 255, 0.6); }
        .glass-card img { width: 100%; border-radius: 25px; height: 320px; object-fit: cover; }

        .btn-buy {
            width: 100%; padding: 16px; background: var(--deep-blue); color: white; border: none;
            border-radius: 50px; font-weight: 800; cursor: pointer; margin-top: 20px;
            transition: 0.3s; box-shadow: 0 10px 20px rgba(28, 126, 214, 0.2);
        }
        .btn-buy:hover { background: var(--main-blue); transform: scale(1.02); }

        footer { padding: 50px; text-align: center; color: var(--main-blue); font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo"><img src="assets/logo.jpg" alt="Siya Store"></div>
        <div class="nav-links">
            <a href="#shop">SHOP</a>
            <a href="#">COLLECTION</a>
        </div>
    </nav>

    <section class="hero">
        <h1 class="hero-title">SIYA<br><span style="color: white; -webkit-text-stroke: 2.5px var(--deep-blue);">CLOUD</span></h1>
        <p class="hero-subtitle">NOTI EXCLUSIVE</p>
    </section>

    <section class="products" id="shop">
        <div class="glass-card">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000" alt="Art 1">
            <h2>Blue Dream #01</h2>
            <p>$185.00</p>
            <button class="btn-buy" onclick="magicStars(event)">ADD TO CART</button>
        </div>
        <div class="glass-card">
            <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?q=80&w=1000" alt="Art 2">
            <h2>Sky Spirit</h2>
            <p>$310.00</p>
            <button class="btn-buy" onclick="magicStars(event)">ADD TO CART</button>
        </div>
    </section>

    <footer>DESIGNED BY SIYA STORE x NOTI</footer>

    <script>
        // تأثير النجوم عند الضغط
        function magicStars(e) {
            for (let i = 0; i < 12; i++) {
                const s = document.createElement('div');
                s.innerHTML = '✦';
                s.style.cssText = `position:fixed; left:${e.clientX}px; top:${e.clientY}px; color:#74c0fc; pointer-events:none; z-index:2000;`;
                document.body.appendChild(s);
                gsap.to(s, {
                    x: (Math.random()-0.5)*150, y: (Math.random()-0.5)*150,
                    opacity:0, rotation:360, duration:0.8, onComplete:()=>s.remove()
                });
            }
        }

        // إعدادات الخلفية ثلاثية الأبعاد
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const bubbles = [];
        const geom = new THREE.SphereGeometry(0.4, 24, 24);
        for(let i=0; i<35; i++) {
            const mat = new THREE.MeshPhongMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.35 });
            const b = new THREE.Mesh(geom, mat);
            b.position.set((Math.random()-0.5)*12, (Math.random()-0.5)*12, (Math.random()-0.5)*12);
            scene.add(b);
            bubbles.push(b);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            bubbles.forEach(b => {
                b.position.y += Math.sin(Date.now()*0.001 + b.position.x)*0.004;
                b.rotation.x += 0.01;
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
