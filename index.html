<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | Noti Universe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --soft-blue: #a5d8ff;
            --main-blue: #74c0fc;
            --white: #ffffff;
        }

        body { margin: 0; background: #e7f5ff; font-family: 'Outfit', sans-serif; overflow-x: hidden; color: #1c7ed6; }
        canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

        /* Navbar Responsive */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 5%; box-sizing: border-box; z-index: 100;
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(10px);
        }
        .nav-logo img { height: clamp(40px, 10vw, 70px); }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: #1c7ed6; font-weight: 600; font-size: 0.8rem; letter-spacing: 1px; }

        /* Hero Section Responsive */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center; padding: 0 20px;
        }
        .hero-title { 
            font-size: clamp(3rem, 15vw, 8rem); 
            font-weight: 900; line-height: 0.9; margin: 0; 
            text-transform: uppercase; 
        }
        .hero-subtitle { font-size: clamp(0.8rem, 4vw, 1.2rem); letter-spacing: clamp(5px, 2vw, 15px); margin-top: 20px; color: var(--main-blue); }

        /* Product Grid Responsive */
        .products { 
            padding: 50px 5%; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 30px; 
            max-width: 1400px; margin: auto;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.3); backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.5); padding: 20px; border-radius: 30px;
            text-align: center; transition: 0.4s ease;
        }
        .glass-card img { width: 100%; border-radius: 20px; height: 300px; object-fit: cover; }
        .glass-card h2 { font-size: 1.2rem; margin: 15px 0 5px; }

        .btn-buy {
            width: 100%; padding: 15px; background: #1c7ed6; color: white; border: none;
            border-radius: 50px; font-weight: 700; cursor: pointer; margin-top: 15px;
            position: relative; overflow: hidden;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            nav { padding: 10px 15px; }
            .nav-links { gap: 10px; }
            .hero-title { -webkit-text-stroke: 1px #1c7ed6; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo"><img src="assets/logo.png" alt="Siya Store"></div>
        <div class="nav-links">
            <a href="#">SHOP</a>
            <a href="#">CART</a>
        </div>
    </nav>

    <section class="hero">
        <h1 class="hero-title">SIYA<br><span style="color: white; -webkit-text-stroke: 2px #1c7ed6;">CLOUD</span></h1>
        <p class="hero-subtitle">BY NOTI</p>
    </section>

    <section class="products">
        <div class="glass-card">
            <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=1000" alt="Product">
            <h2>Cosmic Blue</h2>
            <p>$120.00</p>
            <button class="btn-buy" onclick="createStars(event)">ADD TO CART</button>
        </div>
        <div class="glass-card">
            <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=1000" alt="Product">
            <h2>Heavenly Art</h2>
            <p>$250.00</p>
            <button class="btn-buy" onclick="createStars(event)">ADD TO CART</button>
        </div>
    </section>

    <script>
        // --- Magic Stars Effect ---
        function createStars(e) {
            for (let i = 0; i < 15; i++) {
                const star = document.createElement('div');
                star.innerHTML = '✦';
                star.style.position = 'fixed';
                star.style.left = e.clientX + 'px';
                star.style.top = e.clientY + 'px';
                star.style.color = '#74c0fc';
                star.style.pointerEvents = 'none';
                star.style.zIndex = '1000';
                document.body.appendChild(star);

                gsap.to(star, {
                    x: (Math.random() - 0.5) * 200,
                    y: (Math.random() - 0.5) * 200,
                    opacity: 0,
                    rotation: 360,
                    duration: 1,
                    onComplete: () => star.remove()
                });
            }
        }

        // --- 3D Background Optimized for Performance ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Performance for Mobile
        document.body.appendChild(renderer.domElement);

        const bubbles = [];
        const geometry = new THREE.SphereGeometry(0.3, 16, 16);
        for(let i=0; i<30; i++) {
            const mat = new THREE.MeshPhongMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.4 });
            const bubble = new THREE.Mesh(geometry, mat);
            bubble.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
            scene.add(bubble);
            bubbles.push(bubble);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            bubbles.forEach(b => {
                b.position.y += Math.sin(Date.now() * 0.001 + b.position.x) * 0.005;
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
