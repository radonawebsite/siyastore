<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | Official AI Guide</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky-blue: #a5d8ff;
            --y2k-blue: #74c0fc;
            --deep-blue: #1c7ed6;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #f0f8ff, #ffffff);
            font-family: 'Outfit', sans-serif; overflow-x: hidden;
        }

        /* خلفية الغيوم والنجوم */
        .cloud-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; opacity: 0.5; }
        .cloud { position: absolute; background: white; border-radius: 100px; filter: blur(40px); animation: move var(--d) linear infinite; }
        @keyframes move { from { transform: translateX(-200px); } to { transform: translateX(110vw); } }
        .star { position: absolute; color: var(--y2k-blue); font-size: 18px; z-index: 2; animation: blink 2s infinite ease-in-out; }
        @keyframes blink { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1.2); } }

        /* --- شخصية Siya المرشدة --- */
        #siya-guide {
            position: fixed;
            bottom: -500px; /* مخفية تحت */
            right: 20px;
            width: 250px; /* حجم كافي باش تبان الشخصية كاملة */
            z-index: 9999; /* فوق كل شي */
            transition: bottom 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #siya-guide img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
        }

        .bubble {
            position: absolute;
            bottom: 90%; /* فوق الرأس */
            right: 10px;
            width: 200px;
            background: white;
            border: 2px solid var(--y2k-blue);
            padding: 12px;
            border-radius: 20px 20px 0 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--deep-blue);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            opacity: 0;
            transform: scale(0);
            transition: 0.3s ease;
            pointer-events: none;
            z-index: 10000;
        }

        /* المحتوى */
        .content { position: relative; z-index: 10; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(255,255,255,0.4); backdrop-filter: blur(10px); border-bottom: 1px solid var(--sky-blue); }
        .nav-logo img { height: 70px; }
        .hero { height: 50vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 900; color: var(--deep-blue); margin: 0; }
        
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 50px 5%; max-width: 1200px; margin: auto; }
        .card { background: rgba(255,255,255,0.8); border: 2px solid var(--sky-blue); border-radius: 30px; padding: 20px; text-align: center; transition: 0.3s ease; cursor: pointer; }
        .card:hover { transform: translateY(-10px); border-color: var(--deep-blue); }
        .card img { width: 100%; border-radius: 20px; }
    </style>
</head>
<body>

    <div class="cloud-bg" id="clouds"></div>

    <div id="siya-guide">
        <div class="bubble" id="siya-bubble">Welcome! I'm Siya, your guide! ✨</div>
        <img src="siya.jpg" id="siya-img" alt="Siya">
    </div>

    <div class="content">
        <nav>
            <div class="nav-logo">
                <img src="assets/logo.jpg" onerror="this.src='assets/logo.png'" alt="Logo">
            </div>
            <div style="font-weight: 900; color: var(--deep-blue);">SIYA INTERFACE</div>
        </nav>

        <section class="hero">
            <h1>SIYA STORE</h1>
            <p style="letter-spacing: 5px;">NEW GENERATION SHOPPING</p>
        </section>

        <section class="products">
            <div class="card" onmouseover="siyaSpeak('Check out our new collection!')">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000">
                <h3>VIRTUAL ITEM A</h3>
            </div>
            <div class="card" onmouseover="siyaSpeak('This one is my favorite! ✨')">
                <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?q=80&w=1000">
                <h3>SKY ITEM B</h3>
            </div>
        </section>
    </div>

    <script>
        // 1. توليد الغيوم والنجوم
        const cloudContainer = document.getElementById('clouds');
        for (let i = 0; i < 8; i++) {
            const cloud = document.createElement('div');
            cloud.className = 'cloud';
            const size = Math.random() * 200 + 150;
            cloud.style.width = size + 'px'; cloud.style.height = (size * 0.6) + 'px';
            cloud.style.top = Math.random() * 80 + 'vh'; cloud.style.left = Math.random() * 100 + 'vw';
            cloud.style.setProperty('--d', (Math.random() * 20 + 20) + 's');
            cloudContainer.appendChild(cloud);
        }

        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star'; star.innerHTML = '✦'; 
            star.style.top = Math.random() * 100 + 'vh'; star.style.left = Math.random() * 100 + 'vw';
            star.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(star);
        }

        // 2. منطق التحكم في Siya
        const siyaGuide = document.getElementById('siya-guide');
        const bubble = document.getElementById('siya-bubble');

        window.onload = () => {
            // الشخصية تطلع من التحت بشكل كامل
            setTimeout(() => {
                siyaGuide.style.bottom = "0px";
                setTimeout(() => {
                    siyaSpeak("Hi! I'm Siya. I'll help you navigate the store!");
                }, 1000);
            }, 500);
        };

        function siyaSpeak(text) {
            bubble.innerText = text;
            bubble.style.opacity = "1";
            bubble.style.transform = "scale(1)";
            
            // الفقاعة تختفي بعد 4 ثواني
            setTimeout(() => {
                bubble.style.opacity = "0";
                bubble.style.transform = "scale(0)";
            }, 4000);
        }
    </script>
</body>
</html>
