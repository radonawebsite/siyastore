<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | Neo-Noti Universe</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Outfit:wght@200;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky-neon: #00d4ff;
            --soft-blue: #e1f5fe;
            --deep-blue: #0277bd;
            --white: #ffffff;
        }

        body { 
            margin: 0; background: var(--white); 
            font-family: 'Outfit', sans-serif; overflow-x: hidden; color: var(--deep-blue);
        }

        /* Sci-Fi Grid Background */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; pointer-events: none; }

        .ui-layer { position: relative; z-index: 10; }

        /* Navigation - Glassmorphism Sci-Fi */
        nav {
            position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between;
            align-items: center; padding: 15px 5%; box-sizing: border-box; z-index: 1000;
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--soft-blue);
        }
        
        .nav-logo img { height: 75px; filter: drop-shadow(0 0 10px var(--sky-neon)); }

        .nav-links a { 
            text-decoration: none; color: var(--deep-blue); font-family: 'Syncopate', sans-serif;
            font-weight: 700; font-size: 0.7rem; letter-spacing: 2px; transition: 0.3s;
        }

        /* Hero - Cyber Sky */
        .hero {
            height: 100vh; display: flex; flex-direction: column; justify-content: center;
            align-items: center; text-align: center;
        }

        .hero-title { 
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(3rem, 12vw, 7rem); font-weight: 900; line-height: 0.9;
            margin: 0; text-transform: uppercase;
            background: linear-gradient(to bottom, var(--deep-blue), var(--sky-neon));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3));
        }

        /* Scanner Line Animation */
        .scanner-line {
            position: absolute; width: 100%; height: 2px; background: var(--sky-neon);
            opacity: 0.2; box-shadow: 0 0 15px var(--sky-neon);
            animation: scan 4s linear infinite; z-index: 5;
        }

        @keyframes scan { 0% { top: 0; } 100% { top: 100vh; } }

        /* Products - Neo Cards */
        .products { 
            padding: 100px 5%; display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 40px; max-width: 1300px; margin: auto;
        }

        .neo-card {
            background: rgba(255, 255, 255, 0.8); border: 1px solid var(--soft-blue);
            padding: 20px; border-radius: 5px; position: relative;
            overflow: hidden; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(0 0, 90% 0, 100% 10%, 100% 100%, 10% 100%, 0 90%); /* Sci-Fi Cut */
        }

        .neo-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--sky-neon);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }

        .neo-card img { width: 100%; height: 400px; object-fit: cover; border-bottom: 2px solid var(--soft-blue); }

        .btn-interact {
            width: 100%; padding: 15px; background: transparent; 
            border: 1px solid var(--deep-blue); color: var(--deep-blue);
            font-family: 'Syncopate', sans-serif; font-size: 0.7rem; font-weight: 900;
            cursor: pointer; margin-top: 20px; transition: 0.3s;
            position: relative; overflow: hidden;
        }

        .btn-interact:hover { background: var(--deep-blue); color: white; box-shadow: 0 0 20px var(--sky-neon); }

        /* Footer */
        footer { padding: 40px; text-align: center; font-size: 0.6rem; letter-spacing: 5px; font-family: 'Syncopate'; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="scanner-line"></div>

    <nav>
        <div class="nav-logo"><img src="assets/logo.jpg" onerror="this.src='assets/logo.png'" alt="Siya Store"></div>
        <div class="nav-links"><a href="#shop">PROXIMITY_STORE</a></div>
    </nav>

    <div class="ui-layer">
        <section class="hero">
            <h1 class="hero-title">NEO<br>VISION</h1>
            <p style="letter-spacing: 10px; font-weight: 200;">SIYA STORE x NOTI DIGITAL</p>
        </section>

        <section class="products" id="shop">
            <div class="neo-card" onclick="ripple(event)">
                <img src="https://images.unsplash.com/photo-1614728263952-84ea206f99b6?q=80&w=1000" alt="Noti Art">
                <h3>VIRTUAL_DATA_01</h3>
                <p>$320.00</p>
                <button class="btn-interact">INITIALIZE_PURCHASE</button>
            </div>
            <div class="neo-card" onclick="ripple(event)">
                <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?q=80&w=1000" alt="Noti Art">
                <h3>AETHER_FRAME</h3>
                <p>$580.00</p>
                <button class="btn-interact">INITIALIZE_PURCHASE</button>
            </div>
        </section>
    </div>

    <footer>ACCESSING SIYA_DATABASE 2.0 // BY NOTI</footer>

    <script>
        // --- 3D Grid & Clouds ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Infinite Sci-Fi Grid
        const grid = new THREE.GridHelper(100, 50, 0x00d4ff, 0xe1f5fe);
        grid.position.y = -2;
        grid.material.opacity = 0.2;
        grid.material.transparent = true;
        scene.add(grid);

        camera.position.z = 5;
        camera.position.y = 1;

        // --- Visual Effects ---
        
        // Ripple Effect on Click
        function ripple(e) {
            const circle = document.createElement('div');
            circle.style.cssText = `
                position: fixed; top: ${e.clientY}px; left: ${e.clientX}px;
                width: 10px; height: 10px; border: 2px solid var(--sky-neon);
                border-radius: 50%; pointer-events: none; z-index: 9999;
                transform: translate(-50%, -50%);
            `;
            document.body.appendChild(circle);
            gsap.to(circle, { scale: 20, opacity: 0, duration: 0.6, onComplete: () => circle.remove() });
        }

        // Mouse Move Influence
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth - 0.5) * 2;
            const y = (e.clientY / window.innerHeight - 0.5) * 2;
            gsap.to(camera.rotation, { y: -x * 0.1, x: -y * 0.1, duration: 1 });
        });

        function animate() {
            requestAnimationFrame(animate);
            grid.position.z += 0.05; // Moving Grid Effect
            if(grid.position.z > 2) grid.position.z = 0;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>
</html>
