<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siya Store | Official Noti</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sky-blue: #a5d8ff;
            --main-blue: #74c0fc;
            --deep-blue: #1c7ed6;
            --white: #ffffff;
        }

        body { 
            margin: 0; 
            background: #e7f5ff; 
            font-family: 'Outfit', sans-serif; 
            overflow-x: hidden; 
            color: var(--deep-blue);
        }

        /* الطبقة السفلية للـ 3D */
        canvas { 
            position: fixed; 
            top: 0; 
            left: 0; 
            z-index: 1; /* الـ 3D في الخلفية */
            pointer-events: none; 
        }

        /* الطبقة العلوية للمحتوى */
        .content-layer {
            position: relative;
            z-index: 10; /* المحتوى فوق الـ 3D */
        }

        /* Navbar */
        nav {
            position: fixed; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            padding: 15px 5%; 
            box-sizing: border-box; 
            z-index: 1000;
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(116, 192, 252, 0.2);
        }
        
        /* تثبيت اللوجو */
        .nav-logo img { 
            height: clamp(55px, 12vw, 90px); 
            width: auto;
            filter: drop-shadow(0 0 10px rgba(116, 192, 252, 0.4));
            display: block;
        }

        .nav-links a { 
            text-decoration: none; 
            color: var(--deep-blue); 
            font-weight: 700; 
            font-size: 0.9rem; 
            letter-spacing: 1px; 
        }

        /* Hero */
        .hero {
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center;
            align-items: center; 
            text-align: center;
        }

        .hero-title { 
            font-size: clamp(3.5rem, 15vw, 8.5rem); 
            font-weight: 900; 
            line-height: 0.85; 
            margin: 0; 
            text-transform: uppercase; 
        }

        .hero-subtitle { 
            font-size: clamp(0.9rem, 4vw, 1.3rem); 
            letter-spacing: clamp(5px, 2vw, 15px); 
            margin-top: 20px; 
            color: var(--main-blue);
        }

        /* Products */
        .products { 
            padding: 100px 5%; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 40px; 
            max-width: 1200px; 
            margin: auto;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.5); 
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.6); 
            padding: 25px; 
            border-radius: 40px;
            text-align: center; 
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover { transform: translateY(-15px); }

        .glass-card img { 
            width: 100%; 
            border-radius: 30px; 
            height: 350px; 
            object-fit: cover; 
        }

        .btn-buy {
            width: 100%; 
            padding: 18px; 
            background: var(--deep-blue); 
            color: white; 
            border: none;
            border-radius: 50px; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">
            <img src="assets/logo.jpg" onerror="this.src='assets/logo.png'" alt="Siya Store">
        </div>
        <div class="nav-links">
            <a href="#shop">COLLECTION</a>
        </div>
    </nav>

    <div class="content-layer">
        <section class="hero">
            <h1 class="hero-title">SIYA<br><span style="color: white; -webkit-text-stroke: 2px var(--deep-blue);">STORE</span></h1>
            <p class="hero-subtitle">FEATURING NOTI</p>
        </section>

        <section class="products" id="shop">
            <div class="glass-card">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000" alt="Art">
                <h2>Cloud Piece #01</h2>
                <p>$240.00</p>
                <button class="btn-buy" onclick="stars(event)">PURCHASE</button>
            </div>
            <div class="glass-card">
                <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?q=80&w=1000" alt="Art">
                <h2>Sky Essence</h2>
                <p>$450.00</p>
                <button class="btn-buy" onclick="stars(event)">PURCHASE</button>
            </div>
        </section>
    </div>

    <script>
        // تأثير النجوم
        function stars(e) {
            for(let i=0; i<10; i++) {
                const s = document.createElement('div');
                s.innerHTML = '✦';
                s.style.cssText = `position:fixed; left:${e.clientX}px; top:${e.clientY}px; color:#74c0fc; z-index:2000;`;
                document.body.appendChild(s);
                gsap.to(s, {x:(Math.random()-0.5)*100, y:(Math.random()-0.5)*100, opacity:0, duration:1, onComplete:()=>s.remove()});
            }
        }

        // 3D Scene
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const bubbles = [];
        const geom = new THREE.SphereGeometry(0.4, 24, 24);
        for(let i=0; i<40; i++) {
            const mat = new THREE.MeshPhongMaterial({ color: 0x74c0fc, transparent: true, opacity: 0.3 });
            const b = new THREE.Mesh(geom, mat);
            b.position.set((Math.random()-0.5)*15, (Math.random()-0.5)*15, (Math.random()-0.5)*15);
            scene.add(b);
            bubbles.push(b);
        }

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        camera.position.z = 6;

        function animate() {
            requestAnimationFrame(animate);
            bubbles.forEach(b => {
                b.position.y += Math.sin(Date.now()*0.001 + b.position.x)*0.005;
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
