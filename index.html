<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siyastore | Cosmic Experience</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { position: fixed; top: 0; left: 0; outline: none; }
        
        /* واجهة فوق الـ 3D */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            pointer-events: none; /* باش ما تحبسش الماوس على الـ 3D */
            text-shadow: 0 0 20px rgba(0,191,255,0.8);
        }
        
        h1 { font-size: 5rem; margin: 0; letter-spacing: 10px; text-transform: uppercase; }
        p { font-size: 1.5rem; opacity: 0.7; }
        
        .buy-btn {
            pointer-events: auto;
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #00bfff;
            color: #00bfff;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.5s;
            border-radius: 50px;
            margin-top: 20px;
        }
        .buy-btn:hover { background: #00bfff; color: white; box-shadow: 0 0 50px #00bfff; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="overlay">
        <h1>SIYASTORE</h1>
        <p>مستقبل التسوق بين يديك</p>
        <button class="buy-btn">دخل لعالم الخيال</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // إعدادات المشهد 3D
        const scene = new THREE.Scene();
        const camera = new THREE.Camera(); // كليكي هنا باش نحركو الكاميرا
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // إضافة نجوم خيالية (Stars Particles)
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 15000;
        const posArray = new Float32Array(starCount * 3);

        for(let i=0; i < starCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 5;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starMaterial = new THREE.PointsMaterial({ size: 0.005, color: 0x00bfff });
        const starMesh = new THREE.Points(starGeometry, starMaterial);
        scene.add(starMesh);

        // إضافة "المنتج الخيالي" (عبارة عن جوهرة هندسية كتدور)
        const geometry = new THREE.TorusKnotGeometry(0.5, 0.2, 100, 16);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00bfff, 
            wireframe: true,
            emissive: 0x0044ff
        });
        const crystal = new THREE.Mesh(geometry, material);
        scene.add(crystal);

        // الإضاءة
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(2, 3, 4);
        scene.add(pointLight);

        // تحريك المشهد مع الماوس
        let mouseX = 0;
        let mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Loop ديال الحركة
        function animate() {
            requestAnimationFrame(animate);
            crystal.rotation.y += 0.01;
            crystal.rotation.x += 0.01;
            
            // تأثير حركة الماوس على النجوم
            starMesh.rotation.y = mouseX * 0.0001;
            starMesh.rotation.x = -mouseY * 0.0001;
            
            renderer.render(scene, new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000));
        }

        // ضبط الكاميرا
        const cam = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        cam.position.z = 2;

        function render() {
            requestAnimationFrame(render);
            crystal.rotation.y += 0.005;
            starMesh.rotation.y += 0.001;
            renderer.render(scene, cam);
        }
        render();

        // تجاوب الشاشة
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            cam.aspect = window.innerWidth / window.innerHeight;
            cam.updateProjectionMatrix();
        });
    </script>
</body>
</html>
